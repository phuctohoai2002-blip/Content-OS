<div id="taxonomyWorkspace">
    <div class="page-header">
        <div><h2>Taxonomy</h2><p class="page-description">Manage the hierarchy: Niche → Pillar → Topic, with Keywords and Tags linked to that context.</p></div>
    </div>
    <div class="taxonomy-tabs card">
        <div class="taxonomy-tab-list">
            <button type="button" class="active" data-taxonomy-type="niches">◈ Niches</button>
            <button type="button" data-taxonomy-type="pillars">◉ Pillars</button>
            <button type="button" data-taxonomy-type="topics">◇ Topics</button>
            <button type="button" data-taxonomy-type="keywords">⌕ Keywords</button>
            <button type="button" data-taxonomy-type="tags"># Tags</button>
        </div>
    </div>
    <div id="taxonomyNotice" class="research-notice hidden"></div>
    <div class="card">
        <div class="library-toolbar">
            <input id="taxonomySearch" type="search" placeholder="Search taxonomy..." aria-label="Search taxonomy">
            <span class="library-count" id="taxonomyCount">0 records</span>
            <button type="button" class="capture-button library-add-button" id="taxonomyAddButton">＋ Add Niche</button>
        </div>
        <div class="table-wrapper">
            <table class="data-table library-table">
                <thead><tr id="taxonomyTableHead"><th>Name</th><th>Code / Slug</th><th>Context</th><th>Status</th><th>Date Added</th><th>Actions</th></tr></thead>
                <tbody id="taxonomyTableBody"><tr><td colspan="6"><div class="empty-state compact"><strong>Loading taxonomy...</strong></div></td></tr></tbody>
            </table>
        </div>
    </div>
</div>

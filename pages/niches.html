<div id="taxonomyWorkspace">
    <div class="page-header">
        <div><h2>Taxonomy</h2><p class="page-description">Manage the hierarchy: Niche → Pillar → Topic, with Keywords and Tags linked to that context.</p></div>
        <div class="dashboard-live-status"><span class="live-dot"></span> Live data</div>
    </div>

    <div class="taxonomy-tabs card">
        <div class="taxonomy-tab-list">
            <div class="taxonomy-tab-item"><button type="button" class="active" data-taxonomy-type="niches">◈ Niches</button><button type="button" class="table-action bulk-add-button taxonomy-bulk-button" data-taxonomy-bulk="niches" onclick="document.dispatchEvent(new CustomEvent('content-os:open-bulk',{detail:{type:'niches'}}))">＋ Bulk Niches</button></div>
            <div class="taxonomy-tab-item"><button type="button" data-taxonomy-type="pillars">◉ Pillars</button><button type="button" class="table-action bulk-add-button taxonomy-bulk-button hidden" data-taxonomy-bulk="pillars" onclick="document.dispatchEvent(new CustomEvent('content-os:open-bulk',{detail:{type:'pillars'}}))">＋ Bulk Pillars</button></div>
            <div class="taxonomy-tab-item"><button type="button" data-taxonomy-type="topics">◇ Topics</button><button type="button" class="table-action bulk-add-button taxonomy-bulk-button hidden" data-taxonomy-bulk="topics" onclick="document.dispatchEvent(new CustomEvent('content-os:open-bulk',{detail:{type:'topics'}}))">＋ Bulk Topics</button></div>
            <div class="taxonomy-tab-item"><button type="button" data-taxonomy-type="keywords">⌕ Keywords</button><button type="button" class="table-action bulk-add-button taxonomy-bulk-button hidden" data-taxonomy-bulk="keywords" onclick="document.dispatchEvent(new CustomEvent('content-os:open-bulk',{detail:{type:'keywords'}}))">＋ Bulk Keywords</button></div>
            <div class="taxonomy-tab-item"><button type="button" data-taxonomy-type="tags"># Tags</button><button type="button" class="table-action bulk-add-button taxonomy-bulk-button hidden" data-taxonomy-bulk="tags" onclick="document.dispatchEvent(new CustomEvent('content-os:open-bulk',{detail:{type:'tags'}}))">＋ Bulk Tags</button></div>
        </div>
    </div>

    <div id="taxonomyNotice" class="research-notice hidden"></div>

    <div class="card research-form-card">
        <div class="card-header"><div><h3 id="taxonomyFormTitle">Add Niche</h3><span id="taxonomyDescription">Manage niches used across your content system.</span></div></div>
        <form id="taxonomyForm" class="research-form">
            <div class="taxonomy-form-grid">
                <label>Name / Keyword<input name="name" required placeholder="Name"></label>
                <label id="nicheCodeField">Code<input name="code" placeholder="Auto or custom code"></label>
                <label id="nicheParentField" class="hidden">Niche<select id="taxonomyNiche" name="niche_id"><option value="">Select niche</option></select></label>
                <label id="pillarParentField" class="hidden">Pillar<select id="taxonomyPillar" name="pillar_id"><option value="">Select pillar</option></select></label>
                <label id="topicParentField" class="hidden">Topic<select id="taxonomyTopic" name="topic_id"><option value="">Select topic</option></select></label>
                <label id="keywordExtraFields" class="hidden">Category<input name="category" placeholder="Optional category"></label>
                <label id="keywordMeaningField" class="hidden">Vietnamese Meaning<input name="meaning" placeholder="Optional meaning"></label>
                <label id="keywordPlatformField" class="hidden">Platform<input name="platform" placeholder="Douyin / Xiaohongshu / ..."></label>
                <label class="taxonomy-description-field">Description<input name="description" placeholder="Optional description"></label>
            </div>
            <div class="research-form-actions"><button id="taxonomySubmit" type="submit" class="capture-button">Add Niche</button><button id="taxonomyCancel" type="button" class="table-action hidden">Cancel</button><span data-tax-bulk hidden></span></div>
        </form>
    </div>

    <div class="section-heading"><h3>Taxonomy Database</h3><span><strong id="taxonomyCount">0</strong> records</span></div>
    <div class="card">
        <div class="research-toolbar"><input id="taxonomySearch" type="search" placeholder="Search taxonomy..."><span id="taxonomyLoading" class="badge hidden">Loading...</span></div>
        <div class="table-wrapper"><table class="data-table"><thead><tr><th>Name</th><th>Code / Slug</th><th>Context</th><th>Status</th><th>Date Added</th><th>Actions</th></tr></thead><tbody id="taxonomyTableBody"><tr><td colspan="6"><div class="empty-state compact"><strong>Loading taxonomy...</strong></div></td></tr></tbody></table></div>
    </div>
</div>

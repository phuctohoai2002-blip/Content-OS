<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Content OS</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>

<div id="app">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar">

        <div class="sidebar-header">
            <div class="logo-mark">C</div>

            <div class="logo-text">
                <strong>Content OS</strong>
                <span>Personal Workspace</span>
            </div>
        </div>


        <!-- NICHE SELECTOR -->
        <div class="niche-selector">

            <label>Current Niche</label>

            <button id="nicheButton" class="niche-button">

                <div class="niche-info">
                    <span id="currentNicheDot" class="niche-dot"></span>

                    <div>
                        <strong id="currentNicheName">
                            All Niches
                        </strong>

                        <small id="currentNicheCode">
                            MASTER
                        </small>
                    </div>
                </div>

                <span class="chevron">⌄</span>

            </button>

        </div>


        <!-- NAVIGATION -->
        <nav class="sidebar-nav">

            <div class="nav-section">

                <span class="nav-label">
                    WORKSPACE
                </span>

                <a href="#dashboard" class="nav-item active">
                    <span class="nav-icon">⌂</span>
                    <span>Dashboard</span>
                </a>

                <a href="#research" class="nav-item">
                    <span class="nav-icon">⌕</span>
                    <span>Research</span>
                </a>

                <a href="#content" class="nav-item">
                    <span class="nav-icon">▣</span>
                    <span>Content</span>
                </a>

                <a href="#calendar" class="nav-item">
                    <span class="nav-icon">□</span>
                    <span>Calendar</span>
                </a>

            </div>


            <div class="nav-section">

                <span class="nav-label">
                    TRACKING
                </span>

                <a href="#tracking" class="nav-item">
                    <span class="nav-icon">↗</span>
                    <span>Video Tracking</span>
                </a>

                <a href="#analytics" class="nav-item">
                    <span class="nav-icon">◒</span>
                    <span>Analytics</span>
                </a>

            </div>


            <div class="nav-section">

                <span class="nav-label">
                    SYSTEM
                </span>

                <a href="#niches" class="nav-item">
                    <span class="nav-icon">◈</span>
                    <span>Niches</span>
                </a>

                <a href="#settings" class="nav-item">
                    <span class="nav-icon">⚙</span>
                    <span>Settings</span>
                </a>

            </div>

        </nav>


        <!-- SIDEBAR FOOTER -->
        <div class="sidebar-footer">

            <div class="system-status">
                <span class="status-dot"></span>

                <div>
                    <strong>System Online</strong>
                    <small>Supabase connected</small>
                </div>
            </div>

        </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <!-- TOPBAR -->
        <header class="topbar">

            <div class="topbar-left">

                <button id="mobileMenuButton" class="mobile-menu-button">
                    ☰
                </button>

                <div>
                    <div class="breadcrumb">
                        Workspace
                    </div>

                    <h1 id="pageTitle">
                        Dashboard
                    </h1>
                </div>

            </div>


            <div class="topbar-right">

                <button class="icon-button" title="Search">
                    ⌕
                </button>

                <button class="icon-button" title="Notifications">
                    ♢
                </button>

                <div class="avatar">
                    X
                </div>

            </div>

        </header>


        <!-- PAGE CONTENT -->
        <section id="pageContent" class="page-content">

            <!-- Router injects page here -->

        </section>

    </main>

</div>


<!-- NICHE MENU -->
<div id="nicheMenu" class="niche-menu hidden">

    <div class="niche-menu-header">
        <strong>Select Niche</strong>
    </div>

    <!--
        Niche options will be loaded dynamically
        from Supabase.
    -->

</div>


<script src="js/mock-data.js"></script>
<script src="js/state.js"></script>
<script src="js/router.js"></script>
<script type="module" src="js/app.js"></script>



</body>
</html>
